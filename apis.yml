aid: control-seat
name: Control Seat
description: >-
  Control Seat is an AI-native industrial systems integrator building a modern
  replacement for legacy SCADA (Supervisory Control and Data Acquisition)
  platforms such as Ignition, WinCC, and FactoryTalk. It designs, builds,
  deploys, and runs the full industrial control stack, from PLC programming
  (Allen-Bradley, Siemens, Beckhoff) and HMI/SCADA operator screens to OT/IT
  networking, historians, and analytics, on a single unified platform. The
  product connects to field devices over OPC UA and MQTT (Sparkplug B),
  integrates with AVEVA PI, Ignition, and standard SQL/time-series databases
  (PostgreSQL, MySQL, InfluxDB, Prometheus) plus REST APIs, and streams 10k+
  tags per second at sub-100ms latency. AI-native features let operators
  generate control screens in seconds, run anomaly detection and forecasting,
  and query the historian in plain English. Enterprise capabilities include
  SSO, SCIM, role-based access control, and audit logs, with deployment on
  managed cloud or self-hosted on-premises. Founded in 2025 by Jack Grodnick
  and Warren Shepard, Control Seat is based in San Francisco and backed by
  Y Combinator (Summer 2026).
